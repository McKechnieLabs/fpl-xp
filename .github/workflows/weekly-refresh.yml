name: Weekly data refresh

# Runs the full pipeline against the latest historical CSVs (this runner has
# unrestricted egress, unlike the sandboxed dev environment this project is
# usually built in -- see docs/judgment-calls.md), regenerates reports/ and
# site/data/*.json + site/plots/*.png, commits them back to main, and
# publishes site/ to the gh-pages branch for GitHub Pages.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (test -> model selection -> frozen backtest)
        run: make all

      - name: Commit regenerated reports + site data to main
        run: |
          git config user.name "fpl-xp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ site/data/ site/plots/ data/manifest.json
          git diff --cached --quiet || git commit -m "Weekly refresh: regenerate backtest + site data"
          git push

      - name: Publish site/ to gh-pages
        run: |
          git config user.name "fpl-xp-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gh-pages-deploy
          mkdir -p /tmp/gh-pages-deploy
          cp -r site/. /tmp/gh-pages-deploy/
          cd /tmp/gh-pages-deploy
          git init -q
          git checkout -q -B gh-pages
          git add -A
          git commit -q -m "Publish site $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
